; Pocket Brick Console – Brick Game firmware
; Board: LCDwiki ES3C28P / ES3N28P (ESP32-S3 N16R8: 16 MB quad flash, 8 MB octal PSRAM)
; Build without installing anything:   ./pio.sh run
; Flash:                               ./pio.sh run -t upload

[platformio]
default_envs = es3n28p

[env:es3n28p]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -DBOARD_HAS_PSRAM
    ; Serial over the chip's own USB (USB-Serial/JTAG, /dev/ttyACM0)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Panel tweaks for the real hardware (see src/hal/Display.h)
    ; -DLCD_INVERT=true
    ; -DLCD_RGB_ORDER=true
    ; -DBOOT_COLOR_TEST=0
    ; -DSOUND_LOG
    ; -DTOUCH_DEBUG       ; raw touch registers every 500 ms
    ; -DTOUCH_LOG=0       ; silence the per-tap [touch] log

lib_deps =
    lovyan03/LovyanGFX@^1.2.0

upload_port = /dev/ttyACM0
upload_speed = 460800
monitor_port = /dev/ttyACM0
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
